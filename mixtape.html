<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <title>A Mixtape from Non</title>
  <meta name="description" content="A mixtape — composed by Non. Ten tracks. No sign-in."/>
  <meta property="og:title" content="A Mixtape from Non"/>
  <meta property="og:description" content="A mixtape — composed by Non."/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://nonarkara.org/mixtape"/>
  <meta property="og:image" content="https://nonarkara.org/og.png"/>
  <meta name="theme-color" content="#0d0d0d"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="NON"/>

  <style>
    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; height: 100dvh;
      background: #0d0d0d;
      color: #e8e0d0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh;
      padding: env(safe-area-inset-top, 16px) 24px env(safe-area-inset-bottom, 24px);
      padding-top: max(env(safe-area-inset-top), 20px);
      gap: 0;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: baseline;
      letter-spacing: 0.18em;
      font-size: 11px;
      text-transform: uppercase;
      color: #5a5247;
    }
    .header-logo { color: #e8e0d0; font-size: 13px; letter-spacing: 0.25em; }

    /* ── Dedication ─────────────────────────────────────────────── */
    .dedication {
      width: 100%;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #5a5247;
      text-transform: none;
      padding: 12px 0 0;
      font-style: normal;
    }
    .dedication em { font-style: normal; color: #8a7e6e; }

    /* ── Turntable ───────────────────────────────────────────────── */
    .platter-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .platter {
      position: relative;
      /* size: min of 72vw and 56vh to keep it visible in landscape too */
      width: min(72vw, 56vh, 320px);
      height: min(72vw, 56vh, 320px);
    }

    /* Vinyl disc */
    .disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        /* Label */
        radial-gradient(circle at center, #1a1510 0%, #1a1510 17%, transparent 17%),
        /* Grooves — alternating micro rings */
        repeating-conic-gradient(#1c1c1c 0deg, #1c1c1c 0.4deg, #141414 0.4deg, #141414 1.8deg),
        /* Base vinyl */
        radial-gradient(circle at center, #0d0d0d 0%, #151515 100%);
      animation: spin 2.5s linear infinite;
      animation-play-state: paused;
      will-change: transform;
    }
    .disc.playing { animation-play-state: running; }

    /* Center label */
    .disc-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 30%; height: 30%;
      border-radius: 50%;
      background: #1a1510;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      pointer-events: none;
    }
    .disc-label-name {
      font-size: 7px;
      letter-spacing: 0.22em;
      color: #f59e0b;
      text-transform: uppercase;
      line-height: 1.4;
      text-align: center;
    }
    .disc-label-name .lbl-by { display: block; color: #8a6f2a; font-size: 6px; letter-spacing: 0.18em; }
    .disc-label-track {
      font-size: 8px;
      letter-spacing: 0.15em;
      color: #5a5247;
      margin-top: 2px;
    }

    /* Spindle hole */
    .spindle {
      position: absolute;
      top: 50%; left: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #0d0d0d;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Tonearm */
    .arm-pivot {
      position: absolute;
      top: 6%; right: 4%;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      z-index: 10;
    }
    .arm {
      position: absolute;
      top: calc(6% + 7px);
      right: calc(4% + 7px);
      width: 2px;
      height: 46%;
      background: linear-gradient(to bottom, #4a4a4a, #2a2a2a);
      transform-origin: top center;
      transform: rotate(-28deg);
      border-radius: 1px;
      z-index: 9;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .arm.playing { transform: rotate(-14deg); }
    body.intro .arm:not(.playing) { transform: rotate(-50deg); }
    .arm::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 50%;
      width: 10px; height: 6px;
      background: #f59e0b;
      border-radius: 0 0 3px 3px;
      transform: translateX(-50%);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Track info ──────────────────────────────────────────────── */
    .track-info {
      width: 100%;
      text-align: center;
      padding: 8px 0 4px;
    }
    .track-title {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #e8e0d0;
      margin-bottom: 3px;
      transition: opacity 0.3s;
    }
    .track-num {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #5a5247;
    }

    /* ── Progress ────────────────────────────────────────────────── */
    .progress-wrap {
      width: 100%;
      padding: 8px 0;
      cursor: pointer;
    }
    .progress-bar {
      width: 100%;
      height: 1px;
      background: #2a2520;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: #f59e0b;
      width: 0%;
      transition: width 0.5s linear;
    }
    .progress-times {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #3a3530;
      margin-top: 5px;
    }

    /* ── Controls ────────────────────────────────────────────────── */
    .controls {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 8px 0;
    }
    .ctrl-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; cursor: pointer;
      color: #e8e0d0;
      transition: color 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:active { opacity: 0.5; }
    .ctrl-btn svg { display: block; }

    .play-btn {
      width: 56px; height: 56px;
      border: 1px solid #3a3530;
      border-radius: 50%;
      color: #f59e0b;
    }
    .play-btn:active { background: #1a1510; }

    /* ── Tracklist ───────────────────────────────────────────────── */
    .tracklist-toggle {
      background: none; border: none; cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #3a3530;
      padding: 8px 0;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s;
    }
    .tracklist-toggle:active { color: #e8e0d0; }

    /* ── Share row ─────────────────────────────────────────────── */
    .share-row {
      width: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      padding: 4px 0 2px;
    }
    .share-btn {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 16px;
      background: none;
      border: 1px solid #3a3530;
      color: #f59e0b;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s;
    }
    .share-btn:active { background: #1a1510; }
    .url-chip {
      flex: 1 1 auto;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid #2a2520;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #8a7e6e;
      font-family: inherit;
      text-transform: lowercase;
      transition: color 0.2s, border-color 0.2s;
    }
    .url-chip.copied { color: #f59e0b; border-color: #3a2a10; }

    .tracklist-overlay {
      position: fixed;
      inset: 0;
      background: #0d0d0d;
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 24px);
    }
    .tracklist-overlay.open { transform: translateY(0); }

    .tracklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 24px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #5a5247;
    }
    .tracklist-close {
      background: none; border: none; cursor: pointer;
      color: #e8e0d0; font-family: inherit; font-size: 18px;
      line-height: 1; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .tracklist-items {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .track-item {
      display: flex;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #1a1a1a;
      cursor: pointer;
      gap: 16px;
      min-height: 44px;
      transition: opacity 0.15s;
    }
    .track-item:active { opacity: 0.5; }
    .track-item.active .ti-num { color: #f59e0b; }
    .track-item.active .ti-name { color: #f59e0b; }

    .ti-num {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #3a3530;
      width: 24px;
      flex-shrink: 0;
    }
    .ti-name {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #e8e0d0;
      flex: 1;
    }
    .ti-dur {
      font-size: 10px;
      color: #3a3530;
      letter-spacing: 0.1em;
    }

    /* ── Ambient glow under disc ─────────────────────────────────── */
    .platter-glow {
      position: absolute;
      bottom: -8px;
      left: 50%; transform: translateX(-50%);
      width: 60%; height: 20px;
      background: radial-gradient(ellipse at center, rgba(245,158,11,0.08) 0%, transparent 70%);
      filter: blur(6px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s;
    }
    .platter-glow.on { opacity: 1; }
  </style>
</head>
<body class="intro">

<div class="stage">

  <!-- Header -->
  <div class="header">
    <span class="header-logo">A MIXTAPE</span>
    <span id="hdr-side">SIDE A</span>
  </div>

  <!-- Dedication -->
  <div class="dedication">For whoever's listening. <em>— N</em></div>

  <!-- Turntable -->
  <div class="platter-wrap">
    <div class="platter">
      <div class="disc" id="disc">
        <div class="disc-label">
          <span class="disc-label-name" id="lbl-name"><span class="lbl-by">COMPOSED BY</span>NON</span>
          <span class="disc-label-track" id="lbl-track">—</span>
        </div>
        <div class="spindle"></div>
      </div>
      <div class="arm-pivot"></div>
      <div class="arm" id="arm"></div>
    </div>
    <div class="platter-glow" id="glow"></div>
  </div>

  <!-- Track info -->
  <div class="track-info">
    <div class="track-title" id="track-title">—</div>
    <div class="track-num" id="track-num">TRACK —</div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="progress-times">
      <span id="time-cur">0:00</span>
      <span id="time-dur">—:——</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="btn-prev" aria-label="Previous">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="3" y="3" width="2" height="14" fill="currentColor"/>
        <polygon points="17,3 7,10 17,17" fill="currentColor"/>
      </svg>
    </button>

    <button class="ctrl-btn play-btn" id="btn-play" aria-label="Play / Pause">
      <svg id="icon-play" width="20" height="20" viewBox="0 0 20 20" fill="none">
        <polygon points="5,2 18,10 5,18" fill="currentColor"/>
      </svg>
      <svg id="icon-pause" width="20" height="20" viewBox="0 0 20 20" fill="none" style="display:none">
        <rect x="4" y="2" width="4" height="16" fill="currentColor"/>
        <rect x="12" y="2" width="4" height="16" fill="currentColor"/>
      </svg>
    </button>

    <button class="ctrl-btn" id="btn-next" aria-label="Next">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="15" y="3" width="2" height="14" fill="currentColor"/>
        <polygon points="3,3 13,10 3,17" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <!-- Tracklist toggle -->
  <button class="tracklist-toggle" id="btn-list">All Tracks</button>

  <!-- Share -->
  <div class="share-row">
    <button class="share-btn" id="btn-share">Share</button>
    <div class="url-chip" id="url-chip">nonarkara.org/mixtape</div>
  </div>

</div>

<!-- Tracklist overlay -->
<div class="tracklist-overlay" id="tracklist">
  <div class="tracklist-header">
    <span>Tracklist</span>
    <button class="tracklist-close" id="btn-close">×</button>
  </div>
  <div class="tracklist-items" id="tracklist-items"></div>
</div>

<audio id="player" preload="auto"></audio>

<script>
(function () {
  'use strict';

  // ── Tracklist ──────────────────────────────────────────────────
  // TODO Non: replace with real song titles
  const TRACKS = [
    { id: 1,  title: 'OPENING',         file: 'music/track-01.mp3' },
    { id: 2,  title: 'DRIFT',           file: 'music/track-02.mp3' },
    { id: 3,  title: 'STILL WATER',     file: 'music/track-03.mp3' },
    { id: 4,  title: 'NIGHT DRIVE',     file: 'music/track-04.mp3' },
    { id: 5,  title: 'SIGNAL',          file: 'music/track-05.mp3' },
    { id: 6,  title: 'SLOW HOUR',       file: 'music/track-06.mp3' },
    { id: 7,  title: 'CURRENT',         file: 'music/track-07.mp3' },
    { id: 8,  title: 'REMAIN',          file: 'music/track-08.mp3' },
    { id: 9,  title: 'LAST LIGHT',      file: 'music/track-09.mp3' },
    { id: 10, title: 'CLOSE',           file: 'music/track-10.mp3' },
  ];

  // ── State ──────────────────────────────────────────────────────
  let currentIdx = 0;
  let isPlaying  = false;

  // ── Elements ───────────────────────────────────────────────────
  const player        = document.getElementById('player');
  const disc          = document.getElementById('disc');
  const arm           = document.getElementById('arm');
  const glow          = document.getElementById('glow');
  const btnPlay       = document.getElementById('btn-play');
  const btnPrev       = document.getElementById('btn-prev');
  const btnNext       = document.getElementById('btn-next');
  const iconPlay      = document.getElementById('icon-play');
  const iconPause     = document.getElementById('icon-pause');
  const trackTitle    = document.getElementById('track-title');
  const trackNum      = document.getElementById('track-num');
  const lblName       = document.getElementById('lbl-name');
  const lblTrack      = document.getElementById('lbl-track');
  const progressFill  = document.getElementById('progress-fill');
  const progressWrap  = document.getElementById('progress-wrap');
  const timeCur       = document.getElementById('time-cur');
  const timeDur       = document.getElementById('time-dur');
  const tracklist     = document.getElementById('tracklist');
  const tracklistItems= document.getElementById('tracklist-items');
  const btnList       = document.getElementById('btn-list');
  const btnClose      = document.getElementById('btn-close');
  const hdrSide       = document.getElementById('hdr-side');

  // ── Helpers ────────────────────────────────────────────────────
  function fmt(s) {
    if (!s || !isFinite(s)) return '—:——';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function setPlayState(playing) {
    isPlaying = playing;
    disc.classList.toggle('playing', playing);
    arm.classList.toggle('playing', playing);
    glow.classList.toggle('on', playing);
    iconPlay.style.display  = playing ? 'none'  : 'block';
    iconPause.style.display = playing ? 'block' : 'none';
  }

  function loadTrack(idx, autoplay) {
    const t = TRACKS[idx];
    currentIdx = idx;

    player.src = t.file;
    player.load();

    trackTitle.textContent = t.title;
    trackNum.textContent   = 'TRACK ' + pad2(t.id);
    // lbl-name is set in HTML ("COMPOSED BY · NON") — don't overwrite
    lblTrack.textContent   = pad2(t.id);
    hdrSide.textContent    = idx < 5 ? 'SIDE A' : 'SIDE B';

    progressFill.style.width = '0%';
    timeCur.textContent = '0:00';
    timeDur.textContent = '—:——';

    // update tracklist
    document.querySelectorAll('.track-item').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });

    if (autoplay) {
      player.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
    } else {
      setPlayState(false);
    }
  }

  // ── Controls ───────────────────────────────────────────────────
  btnPlay.addEventListener('click', () => {
    if (!player.src) return;
    if (isPlaying) {
      player.pause();
      setPlayState(false);
    } else {
      player.play().then(() => setPlayState(true)).catch(() => {});
    }
  });

  btnPrev.addEventListener('click', () => {
    if (player.currentTime > 3) {
      player.currentTime = 0;
    } else {
      const idx = (currentIdx - 1 + TRACKS.length) % TRACKS.length;
      loadTrack(idx, isPlaying);
    }
  });

  btnNext.addEventListener('click', () => {
    const idx = (currentIdx + 1) % TRACKS.length;
    loadTrack(idx, isPlaying);
  });

  // Progress tap
  progressWrap.addEventListener('click', (e) => {
    if (!player.duration) return;
    const rect = progressWrap.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    player.currentTime = ratio * player.duration;
  });

  // ── Audio events ───────────────────────────────────────────────
  player.addEventListener('timeupdate', () => {
    if (!player.duration) return;
    const pct = (player.currentTime / player.duration) * 100;
    progressFill.style.width = pct + '%';
    timeCur.textContent = fmt(player.currentTime);
  });

  player.addEventListener('loadedmetadata', () => {
    timeDur.textContent = fmt(player.duration);
  });

  player.addEventListener('ended', () => {
    const idx = (currentIdx + 1) % TRACKS.length;
    loadTrack(idx, true);
  });

  player.addEventListener('pause', () => { if (!player.ended) setPlayState(false); });
  player.addEventListener('play',  () => setPlayState(true));

  // ── Tracklist overlay ──────────────────────────────────────────
  TRACKS.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'track-item' + (i === 0 ? ' active' : '');
    el.innerHTML =
      '<span class="ti-num">' + pad2(t.id) + '</span>' +
      '<span class="ti-name">' + t.title + '</span>' +
      '<span class="ti-dur" id="dur-' + i + '">—:——</span>';
    el.addEventListener('click', () => {
      loadTrack(i, isPlaying);
      tracklist.classList.remove('open');
    });
    tracklistItems.appendChild(el);
  });

  btnList.addEventListener('click', () => tracklist.classList.add('open'));
  btnClose.addEventListener('click', () => tracklist.classList.remove('open'));

  // Swipe down to close overlay
  let touchStartY = 0;
  tracklist.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
  tracklist.addEventListener('touchend', (e) => {
    if (e.changedTouches[0].clientY - touchStartY > 60) {
      tracklist.classList.remove('open');
    }
  }, { passive: true });

  // Try to load durations lazily
  (async function loadDurations() {
    for (let i = 0; i < TRACKS.length; i++) {
      try {
        const a = new Audio();
        await new Promise((resolve) => {
          a.addEventListener('loadedmetadata', resolve, { once: true });
          a.addEventListener('error', resolve, { once: true });
          a.src = TRACKS[i].file;
          a.load();
        });
        const el = document.getElementById('dur-' + i);
        if (el && a.duration && isFinite(a.duration)) {
          el.textContent = fmt(a.duration);
        }
      } catch (_) {}
    }
  })();

  // ── Share ──────────────────────────────────────────────────────
  const btnShare = document.getElementById('btn-share');
  const urlChip  = document.getElementById('url-chip');
  const SHARE_URL = 'https://nonarkara.org/mixtape';

  btnShare.addEventListener('click', async () => {
    const data = {
      title: 'A Mixtape from Non',
      text:  'A mixtape — composed by Non.',
      url:   SHARE_URL,
    };
    if (navigator.share) {
      try { await navigator.share(data); } catch (_) { /* user cancelled */ }
      return;
    }
    try {
      await navigator.clipboard.writeText(SHARE_URL);
      const orig = urlChip.textContent;
      urlChip.textContent = 'COPIED';
      urlChip.classList.add('copied');
      setTimeout(() => {
        urlChip.textContent = orig;
        urlChip.classList.remove('copied');
      }, 1500);
    } catch (_) {}
  });

  // Tap the chip itself also copies (mobile users may expect it)
  urlChip.addEventListener('click', () => btnShare.click());

  // ── Intro — arm wakes up on first load of the session ──────────
  if (!sessionStorage.getItem('mixtape-seen')) {
    setTimeout(() => {
      document.body.classList.remove('intro');
      sessionStorage.setItem('mixtape-seen', '1');
    }, 1200);
  } else {
    document.body.classList.remove('intro');
  }

  // ── Init ───────────────────────────────────────────────────────
  loadTrack(0, false);

})();
</script>
</body>
</html>
