name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# HEADS UP (2026-08-05): this workflow is correct, but the
# CLOUDFLARE_API_TOKEN secret is expired — every run fails with
# "Authentication error [code: 10000]". The same token appears to be
# shared with slic-index and smart-city-thailand-index, which have been
# failing the same way.
#
# Until it is rotated, deploy with ./ship.sh, which uses the wrangler
# OAuth session on Dr Non's machine and needs no secret.
#
# To fix: create a token in the Cloudflare dashboard with
# "Cloudflare Pages: Edit" on account 74ad6bf8dfaaccf82de6f0847f7d2d54
# (API tokens can only be minted in the dashboard, not over the API),
# then hand it to GitHub without pasting it anywhere it can be read back:
#
#   gh secret set CLOUDFLARE_API_TOKEN -R Nonarkara/nonarkara.org
#
# That prompts for the value on stdin. Nothing is echoed and nothing
# lands in shell history.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The door and overlap gates launch Chromium. They resolve Playwright
      # from the package when it is installed, and only then from a developer
      # machine. Install it in the parent directory: this repo already has a
      # node_modules (vendored three), and Node keeps walking parents until
      # it finds the package. The browser stays outside the deploy rsync.
      - name: Install Playwright for the browser gates
        run: |
          npm install --prefix "$GITHUB_WORKSPACE/.." --no-fund --no-audit playwright@1.64.1
          "$GITHUB_WORKSPACE/../node_modules/.bin/playwright" install --with-deps chromium

      - name: Run world and Worker regression suites
        run: |
          node --check app.js
          for test_file in test-*.mjs; do node "$test_file"; done
          for test_file in worker/test-*.mjs; do node "$test_file"; done

      # Pages uploads whatever directory it is given, verbatim, and has no
      # ignore mechanism. Stage a clean copy instead of shipping the repo.
      #
      # AND STAMP IT, exactly as ship.sh does. This workflow used to stage
      # the repo and ship it as-is: the deployed app.js kept NON_BUILD =
      # 'dev' and there was no version.json at all. The self-heal then
      # compared the live build hash against the page's version string —
      # two different kinds of thing that can never be equal — so it fired
      # on EVERY visit, deleted every cache, unregistered the service
      # worker, cleared the browser's HTTP cache and reloaded the page a
      # second and a half in. A reader who tapped anything in that window
      # had their tap thrown away by the reload.
      #
      # Two deploy paths that produce different bytes will always fight.
      # One path, one stamp.
      - name: Stage the public site
        run: |
          rsync -a --exclude-from=.deployignore ./ dist/
          VER=$(grep -m1 -oE "NON_VERSION = '[^']+'" app.js | grep -oE "'[^']+'" | tr -d "'")
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/const NON_BUILD = 'dev';/const NON_BUILD = '${SHA}';/" dist/app.js
          grep -q "NON_BUILD = '${SHA}'" dist/app.js || { echo "build stamp failed"; exit 1; }
          printf '{"version":"%s","build":"%s"}\n' "$VER" "$SHA" > dist/version.json
          echo "version.json → $VER · build $SHA"
          echo "--- staged files ---"
          find dist -type f | wc -l

      # Pull requests run the same regression step and stop before upload.
      # A fork has no Cloudflare secrets, and this job must not publish
      # a PR branch over the live site.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nonarkara-org --branch=main
