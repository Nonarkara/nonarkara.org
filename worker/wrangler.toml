name = "nonarkara-status"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "74ad6bf8dfaaccf82de6f0847f7d2d54"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "STATUS"
id = "08c721ac2a1341e4b2266eeb8eae8fc9"

# Morning-brief episodes. Served through this Worker rather than a
# custom R2 domain — one binding beats a new DNS record and a second
# thing to remember exists.
[[r2_buckets]]
binding = "PODCAST"
bucket_name = "nonarkara-podcast"

[[routes]]
pattern = "api.nonarkara.org"
custom_domain = true

[observability]
enabled = true

# Second Brain secrets — set via: npx wrangler secret put <NAME>
# Do NOT commit actual values here.
# SB_URL          = https://rxalmylnjdvsbiowqari.supabase.co
# SB_SERVICE_KEY  = (Supabase service role JWT)
# OPENAI_KEY      = (OpenAI API key for text-embedding-3-small)
# BRAIN_SHEET_URL = (Google Apps Script /exec URL after deployment)
#
# Fleet alerting secrets — same command, same rule.
# TG_BOT_TOKEN       = (Telegram bot token; alerts go silent without it)
# TG_CHAT_ID         = (chat to ping — a DM with the bot, or a channel id)
# ALERT_TEST_SECRET  = (any string; guards GET /alert-test?key=…)
